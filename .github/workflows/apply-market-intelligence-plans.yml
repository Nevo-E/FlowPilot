name: Apply Market Intelligence plans

on:
  push:
    paths:
      - '.github/workflows/apply-market-intelligence-plans.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Market Intelligence pricing and limits UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------------- Market Intelligence standalone ----------------
          p=Path('market-intelligence.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.plan-card{padding:20px}', '.plan-stack{display:grid;gap:12px}.plan-card{padding:20px}')

          old='''<aside><div class="panel plan-card"><div class="label">MARKET INTELLIGENCE PRO</div><h3>Ricerca approfondita</h3><div class="price">€11,99 <span>/ mese</span></div><div class="feature">Ricerca web aggiornata</div><div class="feature">Fonti verificabili</div><div class="feature">Market size e CAGR</div><div class="feature">Forecast e segmenti</div><div class="feature">Competitor dettagliati</div><div class="feature">Driver, rischi e raccomandazioni</div><button class="btn primary" style="width:100%;margin-top:10px" id="upgradeBtn">Attiva Pro →</button><div class="notice" id="planNote">Puoi acquistare Pro anche senza alcun abbonamento FlowPilot.</div></div></aside>'''
          new='''<aside><div class="plan-stack"><div class="panel plan-card"><div class="label">MARKET INTELLIGENCE PRO</div><h3>Ricerca approfondita</h3><div class="price">€14,99 <span>/ mese</span></div><div class="feature"><b>10 generazioni al mese</b></div><div class="feature">Ricerca web aggiornata</div><div class="feature">Fonti verificabili</div><div class="feature">Market size, CAGR e forecast</div><div class="feature">Segmenti e competitor dettagliati</div><div class="feature">Driver, rischi e raccomandazioni</div><button class="btn primary" style="width:100%;margin-top:10px" id="upgradeBtn">Attiva Pro →</button><div class="notice" id="planNote">Pro include 10 analisi complete per ogni periodo mensile.</div></div><div class="panel plan-card"><div class="label">MARKET INTELLIGENCE BUSINESS</div><h3>Ricerca senza limiti</h3><div class="price">€24,99 <span>/ mese</span></div><div class="feature"><b>Generazioni illimitate</b></div><div class="feature">Tutto ciò che include Pro</div><div class="feature">Ricerca web e fonti</div><div class="feature">Market size, CAGR e forecast</div><div class="feature">Competitor, segmenti e trend</div><div class="feature">Report completi senza limite mensile</div><button class="btn primary" style="width:100%;margin-top:10px" id="businessBtn">Attiva Business →</button><div class="notice" id="businessNote">Pensato per chi usa Market Intelligence in modo continuativo.</div></div></div></aside>'''
          if old not in s: raise SystemExit('standalone pricing block not found')
          s=s.replace(old,new,1)

          s=s.replace('let user=null,ent=null,entSource="base",mode="signin",pendingQuery="";const active=()=>ent?.plan==="pro"&&["active","trialing"].includes(String(ent?.status||""));',
                      'let user=null,ent=null,entSource="base",mode="signin",pendingQuery="",usage=null;const active=()=>["pro","business"].includes(String(ent?.plan||""))&&["active","trialing"].includes(String(ent?.status||""));')
          s=s.replace('<div class="success notice">Market Intelligence Pro · ricerca approfondita</div>', '<div class="success notice">${data.depth==="business"?"Market Intelligence Business":"Market Intelligence Pro"} · ricerca approfondita</div>')

          new_load='''async function loadAccount(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;if(!user){ent=null;entSource="base";usage=null;$("accountBar").classList.add("hidden");$("signinBtn").classList.remove("hidden");$("signupBtn").classList.remove("hidden");$("logoutBtn").classList.add("hidden");$("usageText").textContent="Accedi per iniziare una ricerca di mercato.";return}$("accountBar").classList.remove("hidden");$("accountEmail").textContent=user.email;$("signinBtn").classList.add("hidden");$("signupBtn").classList.add("hidden");$("logoutBtn").classList.remove("hidden");const {data:status}=await db.functions.invoke("market-intelligence-analysis",{body:{action:"status"}});ent={plan:status?.plan||"base",status:status?.status||"included"};entSource=status?.scope||"base";usage=status?.usage||null;const plan=String(ent.plan||"base").toLowerCase(),paid=active(),personal=entSource==="personal",inherited=entSource==="workspace_inherited";$("planPill").textContent=plan.toUpperCase();$("upgradeBtn").style.display=plan==="base"?"block":"none";$("businessBtn").style.display=plan==="business"?"none":"block";$("businessBtn").textContent=plan==="pro"&&personal?"Gestisci / passa a Business →":"Attiva Business →";$("billingBtn").classList.toggle("hidden",!(paid&&personal));$("planNote").className="notice "+(plan==="pro"?"success":"");$("businessNote").className="notice "+(plan==="business"?"success":"");if(plan==="business"){$("planNote").textContent="Business è attivo: tutte le funzioni Pro sono incluse.";$("businessNote").textContent=inherited?"Business è incluso nel tuo workspace FlowPilot ed è valido anche qui.":"Business è attivo sul tuo account: generazioni illimitate.";$("usageText").textContent="Piano Business · generazioni illimitate, ricerca web, fonti e report completi."}else if(plan==="pro"){$("planNote").textContent=inherited?"Pro è incluso nel tuo workspace FlowPilot ed è valido anche qui.":"Pro è attivo: 10 generazioni complete per periodo mensile.";$("businessNote").textContent="Passa a Business per rimuovere il limite di 10 generazioni mensili.";$("usageText").textContent=`Piano Pro · ${usage?.remaining??10} di 10 generazioni rimaste nel periodo corrente.`}else{$("planNote").textContent="Pro: 10 generazioni al mese a €14,99.";$("businessNote").textContent="Business: generazioni illimitate a €24,99 al mese.";$("usageText").textContent=`Piano Base · ${usage?.remaining??3} analisi gratuite rimaste questo mese.`}await loadHistory()}'''
          s,n=re.subn(r'async function loadAccount\(\)\{.*?\}\nasync function loadHistory',new_load+'\nasync function loadHistory',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('loadAccount function not replaced')

          new_run='''async function run(q){q=(q||$("marketQuery").value).trim();if(!q)return toast("Descrivi il mercato da analizzare.");if(!user){pendingQuery=q;authOpen("signup");return}$("marketQuery").value=q;$("marketOutput").innerHTML='<div class="block"><p>Analisi in corso…</p></div>';$("analyzeBtn").disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-analysis",{body:{query:q}});$("analyzeBtn").disabled=false;if(error||data?.error){if(data?.error==="standalone_base_limit_reached"){toast("Hai usato le 3 analisi Base del mese.");$("marketOutput").innerHTML='<div class="notice">Limite Base raggiunto. Pro include 10 generazioni mensili; Business è illimitato.</div>';return}if(data?.error==="pro_monthly_limit_reached"){toast("Hai usato le 10 generazioni Pro del periodo.");$("marketOutput").innerHTML='<div class="notice">Limite Pro raggiunto: 10 generazioni mensili. Passa a Business per generazioni illimitate.</div>';return}$("marketOutput").innerHTML='<div class="notice">Analisi non disponibile. Riprova tra poco.</div>';return}renderReport(data);await loadAccount()}'''
          s,n=re.subn(r'async function run\(q\)\{.*?\}\nasync function upgrade\(\)',new_run+'\nasync function upgrade(plan="pro")',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('run/upgrade boundary not replaced')

          new_upgrade='''async function upgrade(plan="pro"){if(!user){authOpen("signup");return}if(entSource==="personal"&&active()&&ent?.plan!==plan){toast("Apriamo la gestione del piano per completare il cambio.");return billing()}const btn=plan==="business"?$("businessBtn"):$("upgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-checkout",{body:{plan}});btn.disabled=false;if(error||!data?.url){if(data?.error==="already_active")toast(`${plan==="business"?"Business":"Pro"} è già attivo.`);else if(data?.error==="manage_existing_subscription"){toast("Gestisci il piano dal portale pagamenti.");return billing()}else toast("Impossibile aprire il pagamento.");await loadAccount();return}location.href=data.url}'''
          s,n=re.subn(r'async function upgrade\(plan="pro"\)\{.*?\}\nasync function billing',new_upgrade+'\nasync function billing',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('upgrade function not replaced')

          s=s.replace('$("upgradeBtn").onclick=upgrade;$("billingBtn").onclick=billing;', '$("upgradeBtn").onclick=()=>upgrade("pro");$("businessBtn").onclick=()=>upgrade("business");$("billingBtn").onclick=billing;')

          new_init='''async function init(){await loadAccount();const p=new URLSearchParams(location.search);if(p.get("checkout")==="success"){const wanted=p.get("plan")||"pro";history.replaceState({},document.title,location.pathname);toast(`Pagamento completato. Attivazione ${wanted==="business"?"Business":"Pro"}…`);for(let i=0;i<6;i++){await new Promise(r=>setTimeout(r,i?1200:500));await loadAccount();if(ent?.plan===wanted&&active()){toast(`Market Intelligence ${wanted==="business"?"Business":"Pro"} è attivo.`);break}}}else if(p.get("checkout")==="cancelled"){history.replaceState({},document.title,location.pathname);toast("Pagamento annullato.")}}init();'''
          s,n=re.subn(r'async function init\(\)\{.*?\}init\(\);',new_init,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('init function not replaced')
          p.write_text(s,encoding='utf-8')

          # ---------------- Dashboard ----------------
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          old_btn='<button class="btn primary" id="marketUpgradeBtn">Attiva Pro · 11,99 €/mese</button>'
          new_btn='<div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn primary" id="marketUpgradeBtn">Pro · 14,99 €/mese</button><button class="btn primary" id="marketBusinessBtn">Business · 24,99 €/mese</button></div>'
          if old_btn not in s: raise SystemExit('dashboard market buttons target not found')
          s=s.replace(old_btn,new_btn,1)
          s=s.replace('const marketPro=()=>state.marketIntelligence?.plan==="pro"&&["active","trialing"].includes(String(state.marketIntelligence.status||""));','const marketPaid=()=>["pro","business"].includes(String(state.marketIntelligence?.plan||""))&&["active","trialing"].includes(String(state.marketIntelligence.status||""));')

          new_load_dash='''async function loadMarketIntelligence(){if(!state.workspace)return;const {data}=await db.functions.invoke("market-intelligence-analysis",{body:{action:"status",workspace_id:state.workspace.id}});const plan=String(data?.plan||"base").toLowerCase();state.marketIntelligence={plan,status:data?.status||"included",usage:data?.usage||null};state.marketIntelligenceSource=data?.scope||"base";const isOwner=state.workspace.owner_id===state.user.id,remaining=data?.usage?.remaining;$("marketPlan").textContent=`Market Intelligence ${plan==="business"?"Business":plan==="pro"?"Pro":"Base"}`;$("marketUpgradeBtn").disabled=!isOwner;$("marketBusinessBtn").disabled=!isOwner;$("marketUpgradeBtn").style.display=plan==="base"?"inline-block":"none";$("marketBusinessBtn").style.display=plan==="business"?"none":"inline-block";if(plan==="business"){$("marketTierText").textContent="Market Intelligence Business è attivo: generazioni illimitate, ricerca web, fonti e report completi.";$("marketUpgradeTitle").textContent="Market Intelligence Business attivo";$("marketUpgradeText").textContent="Nessun limite mensile di generazione."}else if(plan==="pro"){$("marketTierText").textContent=`Market Intelligence Pro è attivo: ${remaining??10} di 10 generazioni rimaste nel periodo corrente.`;$("marketUpgradeTitle").textContent="Market Intelligence Pro attivo";$("marketUpgradeText").textContent="Pro include 10 generazioni mensili. Business rimuove il limite.";$("marketBusinessBtn").textContent=state.marketIntelligenceSource==="workspace"?"Gestisci / passa a Business":"Business per il team · €24,99"}else{$("marketTierText").textContent="Market Intelligence Base è integrato in FlowPilot. Pro include 10 generazioni al mese; Business è illimitato.";$("marketUpgradeTitle").textContent="Scegli il livello Market Intelligence";$("marketUpgradeText").textContent="Pro: 10 generazioni/mese a €14,99. Business: generazioni illimitate a €24,99.";$("marketUpgradeBtn").textContent=isOwner?"Pro · €14,99/mese":"Attivabile dal proprietario";$("marketBusinessBtn").textContent=isOwner?"Business · €24,99/mese":"Attivabile dal proprietario"}$("marketBillingBtn").style.display=isOwner?"inline-block":"none"}'''
          s,n=re.subn(r'async function loadMarketIntelligence\(\)\{.*?\}\nasync function loadData',new_load_dash+'\nasync function loadData',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('dashboard loadMarketIntelligence not replaced')

          old_error='''if(error||data?.error){$("marketOutput").innerHTML='<div class="market-note">Analisi non disponibile.</div>';return}'''
          new_error='''if(error||data?.error){if(data?.error==="pro_monthly_limit_reached"){$("marketOutput").innerHTML='<div class="market-note">Hai usato le 10 generazioni Pro del periodo. Passa a Business per generazioni illimitate.</div>';return}$("marketOutput").innerHTML='<div class="market-note">Analisi non disponibile.</div>';return}'''
          if old_error not in s: raise SystemExit('dashboard market error target not found')
          s=s.replace(old_error,new_error,1)
          s=s.replace('Analisi Base: valori indicativi. Pro sblocca ricerca web, fonti e report approfonditi.','Analisi Base: valori indicativi. Pro offre 10 generazioni mensili; Business generazioni illimitate con ricerca web e fonti.')

          new_start='''async function startMI(plan="pro"){if(state.workspace.owner_id!==state.user.id)return toast("Solo il proprietario può attivare un piano Market Intelligence.");if(state.marketIntelligenceSource==="workspace"&&marketPaid()){toast("Apriamo la gestione del piano per completare il cambio.");return portal()}const btn=plan==="business"?$("marketBusinessBtn"):$("marketUpgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-checkout",{body:{workspace_id:state.workspace.id,plan}});btn.disabled=false;if(error||!data?.url){if(data?.error==="manage_existing_subscription"){toast("Gestisci il cambio piano dal portale pagamenti.");return portal()}return toast("Impossibile aprire il pagamento.")}location.href=data.url}$("marketUpgradeBtn").onclick=()=>startMI("pro");$("marketBusinessBtn").onclick=()=>startMI("business");'''
          s,n=re.subn(r'async function startMI\(\)\{.*?\}\$\("marketUpgradeBtn"\)\.onclick=startMI;',new_start,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('dashboard startMI not replaced')

          new_return='''async function checkoutReturn(){const p=new URLSearchParams(location.search),s=p.get("market_checkout");if(!s)return;const wanted=p.get("market_plan")||"pro";history.replaceState({},document.title,location.pathname);if(s==="cancelled")return toast("Pagamento annullato.");toast(`Pagamento completato. Attivazione ${wanted==="business"?"Business":"Pro"}…`);for(let i=0;i<6;i++){await new Promise(r=>setTimeout(r,i?1200:600));await loadMarketIntelligence();if(state.marketIntelligence?.plan===wanted){toast(`Market Intelligence ${wanted==="business"?"Business":"Pro"} è attivo per il team.`);showView("market");break}}}'''
          s,n=re.subn(r'async function checkoutReturn\(\)\{.*?\}\n\$\("logoutBtn"\)',new_return+'\n$("logoutBtn")',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('dashboard checkoutReturn not replaced')
          p.write_text(s,encoding='utf-8')

          # ---------------- Homepage copy ----------------
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<b>Market Intelligence Pro</b><br> Disponibile anche separatamente, senza piano FlowPilot. Nel workspace sblocca analisi approfondite, ricerca web, competitor, trend, CAGR, forecast e fonti per il team.', '<b>Market Intelligence Pro / Business</b><br> Disponibile anche separatamente: Pro €14,99/mese con 10 generazioni mensili; Business €24,99/mese con generazioni illimitate. Entrambi includono ricerca web, competitor, trend, CAGR, forecast e fonti.')
          s=s.replace('e, nel livello Pro, di usare ricerche e report più approfonditi.', 'e, con Pro o Business, di usare ricerca web e report approfonditi.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-intelligence.html dashboard.html index.html
          git commit -m "Add Pro and Business Market Intelligence plans" || exit 0
          git push
