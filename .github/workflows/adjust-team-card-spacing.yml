name: Adjust team card spacing

on:
  push:
    paths:
      - '.github/workflows/adjust-team-card-spacing.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase spacing between team summary cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* LUNA_CHAT_AND_NAV_PREMIUM_2026 */'
          addition = '.team-summary{gap:22px;margin-bottom:18px}\n'
          if addition in s:
              raise SystemExit('Team spacing already applied')
          if marker not in s:
              raise SystemExit('CSS marker not found')
          s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit spacing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Increase spacing between Team summary cards"
          git push
