name: Fix hero clipping

on:
  push:
    paths:
      - '.github/workflows/fix-hero-clipping.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prevent hero text clipping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Grid children must be allowed to shrink instead of overflowing.
          if '.hero-grid>*{min-width:0}' not in s:
              s = re.sub(
                  r'(\.hero-grid\{[^}]*\})',
                  r'\1 .hero-grid>*{min-width:0}',
                  s,
                  count=1,
              )

          # Keep the large desktop appearance but leave enough glyph room on the right.
          s = re.sub(
              r'\.hero h1\{\s*font-size:clamp\(50px,6\.4vw,79px\);\s*line-height:\.98;letter-spacing:-\.066em;margin:0 0 24px;max-width:760px\s*\}',
              '.hero h1{ font-size:clamp(50px,6.4vw,79px); line-height:.98;letter-spacing:-.058em;margin:0 0 24px;max-width:100%;padding-right:.08em;overflow-wrap:normal;word-break:normal }',
              s,
              count=1,
          )

          # Responsive headline: scale with viewport instead of forcing 49px on every phone.
          s = s.replace(
              '.hero{padding:68px 0 60px}.hero h1{font-size:49px}',
              '.hero{padding:68px 0 60px}.hero h1{font-size:clamp(38px,10.8vw,46px);letter-spacing:-.05em;line-height:1;padding-right:.12em}',
          )

          # Extra protection for very narrow phones.
          narrow = '@media(max-width:420px){.hero h1{font-size:clamp(36px,10.6vw,42px);letter-spacing:-.045em}.hero-copy{font-size:14px}}'
          if narrow not in s:
              s = s.replace('</style>', narrow + '</style>', 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Fix hero text clipping on responsive layouts"
          git push
