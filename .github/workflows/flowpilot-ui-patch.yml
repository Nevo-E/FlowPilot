name: FlowPilot UI Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flowpilot-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refine briefing hero and status emblems
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('dashboard.html')
          s = path.read_text(encoding='utf-8')

          old_hero_css = '.briefing h2{font-size:32px;line-height:1.12;font-weight:690;margin:10px 0 12px;max-width:820px}.briefing p{font-size:11px;line-height:1.7;max-width:760px;color:#DCCBAF}.kicker{font-size:9px;letter-spacing:.095em;color:#E1C9A1}'
          new_hero_css = '.briefing-copy{position:relative;z-index:1;min-width:0}.briefing h2{font-size:39px;line-height:1.02;font-weight:740;margin:11px 0 0;max-width:760px;letter-spacing:-.052em;text-wrap:balance}.briefing-details{margin-top:22px;max-width:820px;padding:14px 16px 15px;border:1px solid rgba(225,201,161,.22);border-radius:15px;background:linear-gradient(135deg,rgba(246,241,232,.075),rgba(246,241,232,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.briefing-details-label{display:block;margin-bottom:6px;color:#E1C9A1;font-size:8px;font-weight:820;letter-spacing:.12em;text-transform:uppercase}.briefing-details p{margin:0;color:#DCCBAF;font-size:10px;line-height:1.6;max-width:760px}.kicker{font-size:9px;letter-spacing:.095em;color:#E1C9A1}'
          if old_hero_css not in s:
              raise SystemExit('Hero CSS anchor not found')
          s = s.replace(old_hero_css, new_hero_css, 1)

          status_css = '''.status-label{display:inline-flex!important;align-items:center;gap:12px;text-transform:none!important;letter-spacing:-.015em!important;color:#0F1722!important;font-weight:780!important}.status-icon{position:relative;width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;isolation:isolate;border:1px solid rgba(215,190,149,.82);box-shadow:0 10px 24px rgba(15,23,34,.16),inset 0 1px 0 rgba(255,255,255,.48),inset 0 -2px 0 rgba(15,23,34,.13)}.status-icon:before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(15,23,34,.05);z-index:-1}.status-icon:after{content:"";position:absolute;width:30px;height:14px;left:4px;top:-2px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,0));transform:rotate(-10deg);opacity:.72;pointer-events:none}.status-icon svg{width:22px;height:22px;display:block;position:relative;z-index:2;filter:drop-shadow(0 1px 1px rgba(15,23,34,.18))}.status-icon.status-urgent{color:#FFF8EC;background:radial-gradient(circle at 32% 24%,#D8B97E 0,#A7834F 32%,#76532D 72%,#4B331E 100%);border-color:#D7BE95;box-shadow:0 10px 26px rgba(103,75,42,.28),inset 0 1px 0 rgba(255,255,255,.48),inset 0 -2px 0 rgba(63,42,21,.30)}.status-icon.status-attention{color:#3B2A18;background:radial-gradient(circle at 32% 24%,#FFF4DD 0,#E7CFA5 34%,#C39A61 72%,#8C6B3C 100%);border-color:#E5CFAB;box-shadow:0 10px 26px rgba(176,141,87,.25),inset 0 1px 0 rgba(255,255,255,.72),inset 0 -2px 0 rgba(140,107,60,.20)}.status-icon.status-opportunity{color:#F0D9AE;background:radial-gradient(circle at 34% 22%,#465A70 0,#26374B 35%,#182433 70%,#0F1722 100%);border-color:#8C7656;box-shadow:0 10px 26px rgba(15,23,34,.30),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.32)}.brief-stat .status-label{font-size:11px!important}.brief-stat{position:relative;overflow:hidden}.brief-stat:after{content:"";position:absolute;width:110px;height:110px;right:-55px;top:-65px;border-radius:50%;background:radial-gradient(circle,rgba(225,201,161,.16),transparent 68%);pointer-events:none}.signal-col .status-label{font-size:12px!important}.signal-col .status-icon{width:35px;height:35px;flex-basis:35px}.signal-col .status-icon svg{width:20px;height:20px}'''
          pattern = r'\.status-label\{display:inline-flex!important;.*?\.signal-col \.status-icon svg\{width:16px;height:16px\}'
          s, n = re.subn(pattern, status_css, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Status CSS block replacement failed: {n}')

          old_hero_html = '<div class="card briefing"><div><div class="kicker" id="briefingDate">DAILY BRIEFING</div><h2 id="briefingSummary">Analisi del workspace…</h2><p id="briefingDescription">FlowPilot sta raccogliendo i segnali operativi.</p></div><div class="health">'
          new_hero_html = '<div class="card briefing"><div class="briefing-copy"><div class="kicker" id="briefingDate">DAILY BRIEFING</div><h2 id="briefingSummary">Analisi del workspace…</h2><div class="briefing-details"><span class="briefing-details-label">In breve</span><p id="briefingDescription">FlowPilot sta raccogliendo i segnali operativi.</p></div></div><div class="health">'
          if old_hero_html not in s:
              raise SystemExit('Hero HTML anchor not found')
          s = s.replace(old_hero_html, new_hero_html, 1)

          urgent = '''<i class="status-icon status-urgent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4 20 5.9v5.9c0 4.9-3 8.2-8 9.8-5-1.6-8-4.9-8-9.8V5.9L12 2.4Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="m13.6 6.2-5 6.5h3.5l-1.3 5.1 4.9-6.7h-3.4l1.3-4.9Z" fill="currentColor"/></svg></i>'''
          attention = '''<i class="status-icon status-attention"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="1.15" opacity=".72"/><path d="M12 6.9 14.7 12 12 17.1 9.3 12 12 6.9Z" fill="currentColor"/><circle cx="12" cy="12" r="1.25" fill="#FFF7E8"/></svg></i>'''
          opportunity = '''<i class="status-icon status-opportunity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.2 1.8 5.3 5.4 1.8-5.4 1.8-1.8 5.4-1.8-5.4-5.4-1.8 5.4-1.8L12 3.2Z" fill="currentColor"/><path d="m13.8 16.8 2.2-2.2 1.7 1.6 2.4-2.8" fill="none" stroke="#F6F1E8" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.8 13.4h2.3v2.3" fill="none" stroke="#F6F1E8" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg></i>'''

          s, n1 = re.subn(r'<i class="status-icon status-urgent">.*?</i>', urgent, s, flags=re.S)
          s, n2 = re.subn(r'<i class="status-icon status-attention">.*?</i>', attention, s, flags=re.S)
          s, n3 = re.subn(r'<i class="status-icon status-opportunity">.*?</i>', opportunity, s, flags=re.S)
          if min(n1, n2, n3) < 2:
              raise SystemExit(f'Expected both top and lower emblems, got urgent={n1}, attention={n2}, opportunity={n3}')

          render_pattern = r'function renderBriefing\(\)\{.*?\}\nfunction sigHtml'
          render_new = '''function clampBriefingText(value,max){const text=String(value||"").replace(/\\s+/g," ").trim();if(text.length<=max)return text;const cut=text.slice(0,max).replace(/\\s+\\S*$/," ").trim();return `${cut}…`}
function briefingHeadline(b){const company=String(state.workspace?.name||state.profile?.company_name||"L'azienda").trim(),urgent=Number(b.urgent_count||0),attention=Number(b.attention_count||0),opportunity=Number(b.opportunity_count||0);if(urgent>=3)return `${company} sotto pressione: ${urgent} urgenze da sbloccare`;if(urgent>0)return `${company}: ${urgent} urgenze da chiudere oggi`;if(attention>=3)return `${company}: attenzione alta sui rischi operativi`;if(opportunity>0)return `${company} accelera: ${opportunity} opportunità da cogliere`;return `${company}: operazioni sotto controllo`}
function renderBriefing(){const b=state.briefing||{},fullSummary=b.summary||"La situazione operativa è sotto controllo.",headline=b.headline||briefingHeadline(b);$("healthScore").textContent=b.health_score??state.workspace?.health_score??"—";$("aHealth").textContent=b.health_score??state.workspace?.health_score??"—";$("urgentCount").textContent=b.urgent_count||0;$("attentionCount").textContent=b.attention_count||0;$("opportunityCount").textContent=b.opportunity_count||0;$("briefingSummary").textContent=clampBriefingText(headline,94);$("briefingDescription").textContent=clampBriefingText(fullSummary,310);$("topPriority").textContent=b.top_priority||"Nessuna criticità rilevante";$("priorityReason").textContent=b.top_priority_reason||"Nessun segnale critico.";$("recommendedAction").textContent=b.recommended_action||"Continua con le attività pianificate."}
function sigHtml'''
          s, n = re.subn(render_pattern, render_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderBriefing replacement failed: {n}')

          path.write_text(s, encoding='utf-8')

      - name: Validate patch
        run: |
          grep -q 'briefing-details-label' dashboard.html
          grep -q 'function briefingHeadline' dashboard.html
          grep -q 'viewBox="0 0 24 24"' dashboard.html
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "FlowPilot UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Refine briefing headline and premium status emblems"
          git push origin main
