name: Run navy gold palette

on:
  push:
    paths:
      - '.github/palette-navy-gold-trigger.txt'

permissions:
  contents: write

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply palette
        run: python .github/scripts/apply_navy_gold_palette.py
      - name: Commit palette update
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html dashboard.html market-intelligence.html invite.html reset-password.html marketlens.html
          git commit -m "Try FlowPilot navy gold ivory palette" || exit 0
          git push
