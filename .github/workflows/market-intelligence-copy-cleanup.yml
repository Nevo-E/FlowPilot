name: Market Intelligence copy cleanup

on:
  push:
    paths:
      - '.github/workflows/market-intelligence-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Market Intelligence copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('market-intelligence.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="btn secondary" href="index.html">Scopri FlowPilot</a>'
          new = '<a class="btn secondary" href="index.html">← Torna a FlowPilot</a>'
          if old not in s:
              raise SystemExit('Navbar button text not found')
          s = s.replace(old, new, 1)
          old_note = '<div class="hero-note"><span>3 analisi Base gratuite al mese</span><span>Pro a €11,99/mese</span><span>Nessun piano FlowPilot richiesto</span></div>'
          if old_note not in s:
              raise SystemExit('Hero note not found')
          s = s.replace(old_note, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-intelligence.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine Market Intelligence navigation and hero"
          git push origin HEAD:main
