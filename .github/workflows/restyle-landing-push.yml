name: FlowPilot Landing Restyle Push

on:
  push:
    branches: [main]
    paths:
      - '.restyle-landing-trigger'

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply stored landing patch
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/restyle-landing.yml').read_text(encoding='utf-8')
          block = workflow.split('run: |\n',1)[1].split('\n      - name: Validate',1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code,'restyle_landing.py','exec'))
      - name: Validate and commit
        run: |
          grep -q 'FLOWPILOT_PREMIUM_LANDING_2026' index.html
          grep -q 'flowpilot-premium-icons' index.html
          git diff --check
          git config user.name "FlowPilot UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restyle FlowPilot landing with premium design"
          git push origin main
