name: Apply Market Intelligence PDF and Business charts

on:
  push:
    paths:
      - '.github/workflows/apply-market-intelligence-pdf-charts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add PDF export and Business charts
        run: |
          python - <<'PY'
          from pathlib import Path

          deps='''<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>'''
          supabase_script='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.1/dist/umd/supabase.min.js"></script>'

          css='''\n/* MARKET_INTELLIGENCE_REPORT_EXPORT_2026 */\n.report-toolbar{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.chart-card{padding:16px;border:1px solid var(--line);border-radius:11px;background:#FBF8F2}.chart-card.wide{grid-column:1/-1}.chart-card h3{font-size:10px;margin:0 0 5px}.chart-card p{font-size:8px!important;line-height:1.55!important;color:var(--muted)!important;margin:0 0 12px!important}.chart-wrap{position:relative;height:250px}.chart-badge{display:inline-flex;padding:5px 7px;border-radius:999px;background:#EAD8B9;color:#8C6B3C;font-size:7px;font-weight:850;margin-bottom:8px}@media(max-width:700px){.chart-grid{grid-template-columns:1fr}.chart-card.wide{grid-column:auto}.chart-wrap{height:220px}}\n'''

          standalone_helper=r'''\n// MARKET_INTELLIGENCE_EXPORT_AND_CHARTS_2026\nlet currentMIReport=null;let miChartInstances=[];\nfunction clearMICharts(){miChartInstances.forEach(c=>{try{c.destroy()}catch(_){}});miChartInstances=[]}\nfunction renderMICharts(result){clearMICharts();const charts=Array.isArray(result?.charts)?result.charts:[];if(!charts.length||!window.Chart)return;const root=$("marketOutput");const cards=charts.slice(0,3).map((c,i)=>`<div class="chart-card ${i===0?"wide":""}"><div class="chart-badge">BUSINESS · GRAFICO</div><h3>${esc(c.title||`Grafico ${i+1}`)}</h3><p>${esc(c.note||"")}</p><div class="chart-wrap"><canvas id="miChart${i}"></canvas></div></div>`).join("");root.insertAdjacentHTML("beforeend",`<div class="chart-grid">${cards}</div>`);charts.slice(0,3).forEach((c,i)=>{const labels=Array.isArray(c.labels)?c.labels.map(x=>String(x)):[];const values=Array.isArray(c.values)?c.values.map(Number).filter(Number.isFinite):[];if(!labels.length||values.length!==labels.length)return;const ctx=document.getElementById(`miChart${i}`);if(!ctx)return;const type=c.type==="line"?"line":"bar";miChartInstances.push(new Chart(ctx,{type,data:{labels,datasets:[{label:c.unit||"Valore",data:values,borderColor:"#B08D57",backgroundColor:type==="line"?"rgba(176,141,87,.16)":"rgba(176,141,87,.72)",borderWidth:2,tension:.3,fill:type==="line"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>`${x.raw}${c.unit?` ${c.unit}`:""}`}}},scales:{y:{beginAtZero:type==="bar",grid:{color:"rgba(15,23,34,.08)"}},x:{grid:{display:false}}}}}))})}\nconst _renderReport=renderReport;renderReport=function(data){currentMIReport=data||null;clearMICharts();_renderReport(data);const paid=["pro","business"].includes(String(data?.depth||""));$("reportToolbar").classList.toggle("hidden",!paid);if(data?.depth==="business")renderMICharts(data?.result||{})};\nasync function exportMIReportPDF(){if(!currentMIReport||!["pro","business"].includes(String(currentMIReport.depth||"")))return toast("L'esportazione PDF è disponibile con Pro o Business.");if(!window.html2canvas||!window.jspdf?.jsPDF)return toast("Modulo PDF non disponibile. Ricarica la pagina.");const btn=$("exportPdfBtn");btn.disabled=true;const old=btn.textContent;btn.textContent="Creazione PDF…";try{const el=$("marketOutput");const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:"#FBF8F2",logging:false});const img=canvas.toDataURL("image/jpeg",.94);const {jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");const pageW=210,pageH=297,margin=10,header=20,imgW=pageW-margin*2,imgH=canvas.height*imgW/canvas.width,usable=pageH-header-margin;pdf.setFont("helvetica","bold");pdf.setFontSize(15);pdf.text("FlowPilot Market Intelligence",margin,10);pdf.setFont("helvetica","normal");pdf.setFontSize(9);const topic=String(currentMIReport?.result?.topic||"Analisi di mercato").slice(0,95);pdf.text(`${String(currentMIReport.depth).toUpperCase()} · ${topic}`,margin,16,{maxWidth:imgW});let offset=0,page=0;while(offset<imgH){if(page>0)pdf.addPage();const y=page===0?header:margin;const visible=page===0?usable:pageH-margin*2;pdf.addImage(img,"JPEG",margin,y,imgW,imgH,undefined,"FAST",0,-offset);offset+=visible;page++}const safe=topic.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,55)||"market-report";pdf.save(`flowpilot-${safe}.pdf`);toast("PDF esportato.")}catch(e){console.error(e);toast("Non è stato possibile creare il PDF.")}finally{btn.disabled=false;btn.textContent=old}}\n$("exportPdfBtn").onclick=exportMIReportPDF;\n'''

          dashboard_helper=r'''\n// MARKET_INTELLIGENCE_EXPORT_AND_CHARTS_2026\nlet currentDashboardMIReport=null;let dashboardMICharts=[];\nfunction clearDashboardMICharts(){dashboardMICharts.forEach(c=>{try{c.destroy()}catch(_){}});dashboardMICharts=[]}\nfunction renderDashboardMICharts(result){clearDashboardMICharts();const charts=Array.isArray(result?.charts)?result.charts:[];if(!charts.length||!window.Chart)return;const root=$("marketOutput");const cards=charts.slice(0,3).map((c,i)=>`<div class="card chart-card ${i===0?"wide":""}"><div class="chart-badge">BUSINESS · GRAFICO</div><h3>${esc(c.title||`Grafico ${i+1}`)}</h3><p>${esc(c.note||"")}</p><div class="chart-wrap"><canvas id="dashMiChart${i}"></canvas></div></div>`).join("");root.insertAdjacentHTML("beforeend",`<div class="chart-grid">${cards}</div>`);charts.slice(0,3).forEach((c,i)=>{const labels=Array.isArray(c.labels)?c.labels.map(x=>String(x)):[];const values=Array.isArray(c.values)?c.values.map(Number).filter(Number.isFinite):[];if(!labels.length||values.length!==labels.length)return;const ctx=document.getElementById(`dashMiChart${i}`);if(!ctx)return;const type=c.type==="line"?"line":"bar";dashboardMICharts.push(new Chart(ctx,{type,data:{labels,datasets:[{label:c.unit||"Valore",data:values,borderColor:"#B08D57",backgroundColor:type==="line"?"rgba(176,141,87,.16)":"rgba(176,141,87,.72)",borderWidth:2,tension:.3,fill:type==="line"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:type==="bar",grid:{color:"rgba(15,23,34,.08)"}},x:{grid:{display:false}}}}}))})}\nasync function exportDashboardMIPDF(){if(!currentDashboardMIReport||!["pro","business"].includes(String(currentDashboardMIReport.depth||"")))return toast("L'esportazione PDF è disponibile con Pro o Business.");if(!window.html2canvas||!window.jspdf?.jsPDF)return toast("Modulo PDF non disponibile. Ricarica la pagina.");const btn=$("marketExportPdfBtn");btn.disabled=true;const old=btn.textContent;btn.textContent="Creazione PDF…";try{const el=$("marketOutput");const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:"#FBF8F2",logging:false});const img=canvas.toDataURL("image/jpeg",.94);const {jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");const pageW=210,pageH=297,margin=10,header=20,imgW=pageW-margin*2,imgH=canvas.height*imgW/canvas.width,usable=pageH-header-margin;pdf.setFont("helvetica","bold");pdf.setFontSize(15);pdf.text("FlowPilot Market Intelligence",margin,10);pdf.setFont("helvetica","normal");pdf.setFontSize(9);const topic=String(currentDashboardMIReport?.result?.topic||"Analisi di mercato").slice(0,95);pdf.text(`${String(currentDashboardMIReport.depth).toUpperCase()} · ${topic}`,margin,16,{maxWidth:imgW});let offset=0,page=0;while(offset<imgH){if(page>0)pdf.addPage();const y=page===0?header:margin;const visible=page===0?usable:pageH-margin*2;pdf.addImage(img,"JPEG",margin,y,imgW,imgH,undefined,"FAST",0,-offset);offset+=visible;page++}const safe=topic.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,55)||"market-report";pdf.save(`flowpilot-${safe}.pdf`);toast("PDF esportato.")}catch(e){console.error(e);toast("Non è stato possibile creare il PDF.")}finally{btn.disabled=false;btn.textContent=old}}\n$("marketExportPdfBtn").onclick=exportDashboardMIPDF;\n$("marketAnalyze").onclick=async()=>{const q=$("marketQuery").value.trim();if(!q)return toast("Inserisci un mercato.");clearDashboardMICharts();currentDashboardMIReport=null;$("marketReportToolbar").classList.add("hidden");$("marketOutput").innerHTML='<div class="card pad">Analisi in corso…</div>';const {data,error}=await db.functions.invoke("market-intelligence-analysis",{body:{workspace_id:state.workspace.id,query:q}});if(error||data?.error){if(data?.error==="pro_monthly_limit_reached"){$("marketOutput").innerHTML='<div class="market-note">Hai usato le 10 generazioni Pro del periodo. Passa a Business per generazioni illimitate.</div>';return}$("marketOutput").innerHTML='<div class="market-note">Analisi non disponibile.</div>';return}currentDashboardMIReport=data;$("marketReportToolbar").classList.toggle("hidden",!["pro","business"].includes(String(data.depth||"")));const r=data.result||{};if(data.depth==="base"){$("marketOutput").innerHTML=`<div class="market-note">Analisi Base: valori indicativi. Pro offre 10 generazioni mensili ed esportazione PDF; Business aggiunge generazioni illimitate e grafici.</div><div class="report-grid" style="margin-top:12px">${marketCard("Opportunity",`${r.opportunity_score??"n/d"}/100`)}${marketCard("Growth",r.growth_estimate||"n/d")}${marketCard("Competition",r.competition||"n/d")}</div><div class="card pad" style="margin-top:12px"><div class="card-title">Sintesi</div><p class="report-text">${esc(r.summary||"")}</p></div>`}else{const li=a=>(a||[]).map(x=>`<li>${typeof x==="string"?esc(x):`<b>${esc(x.name)}</b> — ${esc(x.note||x.positioning||"")}`}</li>`).join("");const src=(data.sources||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("");$("marketOutput").innerHTML=`<div class="market-note">${data.depth==="business"?"Business · generazioni illimitate · PDF · grafici":"Pro · 10 generazioni/mese · PDF"}</div><div class="report-grid" style="margin-top:12px">${marketCard("Market size",`${r.market_size?.value??"n/d"} ${r.market_size?.unit??""}`,`Anno ${r.market_size?.year??"n/d"}`)}${marketCard("CAGR",r.cagr||"n/d")}${marketCard("Opportunity",`${r.opportunity_score??"n/d"}/100`)}</div><div class="card pad" style="margin-top:12px"><div class="card-title">Executive summary</div><p class="report-text">${esc(r.executive_summary||"")}</p></div><div class="grid-2" style="margin-top:12px"><div class="card pad"><div class="card-title">Segmenti</div><ul class="report-list">${li(r.segments)}</ul></div><div class="card pad"><div class="card-title">Competitor</div><ul class="report-list">${li(r.competitors)}</ul></div></div><div class="report-grid" style="margin-top:12px"><div class="card pad"><div class="card-title">Driver</div><ul class="report-list">${li(r.drivers)}</ul></div><div class="card pad"><div class="card-title">Rischi</div><ul class="report-list">${li(r.risks)}</ul></div><div class="card pad"><div class="card-title">Raccomandazioni</div><ul class="report-list">${li(r.recommendations)}</ul></div></div>${src?`<div class="card pad" style="margin-top:12px"><div class="card-title">Fonti web</div><div class="source-list" style="margin-top:8px">${src}</div></div>`:""}`;if(data.depth==="business")renderDashboardMICharts(r)}await loadMarketIntelligence()};\n'''

          # Standalone page
          p=Path('market-intelligence.html')
          s=p.read_text(encoding='utf-8')
          if 'chart.js@4.4.7' not in s:
              if supabase_script not in s: raise SystemExit('standalone dependency anchor missing')
              s=s.replace(supabase_script,supabase_script+'\n'+deps,1)
          if 'MARKET_INTELLIGENCE_REPORT_EXPORT_2026' not in s:
              s=s.replace('</style>',css+'</style>',1)
          s=s.replace('<div class="feature"><b>10 generazioni al mese</b></div>','<div class="feature"><b>10 generazioni al mese</b></div><div class="feature"><b>Esportazione PDF dei report</b></div>',1)
          s=s.replace('<div class="feature"><b>Generazioni illimitate</b></div>','<div class="feature"><b>Generazioni illimitate</b></div><div class="feature"><b>Esportazione PDF dei report</b></div><div class="feature"><b>Grafici inclusi nei report</b></div>',1)
          if 'id="reportToolbar"' not in s:
              target='<div class="queryrow"><input id="marketQuery" placeholder="Descrivi mercato, paese, segmento o competitor"><button class="btn primary" id="analyzeBtn">Avvia analisi</button></div><div id="marketOutput" class="report"></div>'
              repl='<div class="queryrow"><input id="marketQuery" placeholder="Descrivi mercato, paese, segmento o competitor"><button class="btn primary" id="analyzeBtn">Avvia analisi</button></div><div class="report-toolbar hidden" id="reportToolbar"><button class="btn secondary" id="exportPdfBtn">Esporta PDF</button></div><div id="marketOutput" class="report"></div>'
              if target not in s: raise SystemExit('standalone report toolbar anchor missing')
              s=s.replace(target,repl,1)
          if 'MARKET_INTELLIGENCE_EXPORT_AND_CHARTS_2026' not in s:
              anchor='async function loadAccount()'
              if anchor not in s: raise SystemExit('standalone helper anchor missing')
              s=s.replace(anchor,standalone_helper+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          # Dashboard
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          if 'chart.js@4.4.7' not in s:
              if supabase_script not in s: raise SystemExit('dashboard dependency anchor missing')
              s=s.replace(supabase_script,supabase_script+'\n'+deps,1)
          if 'MARKET_INTELLIGENCE_REPORT_EXPORT_2026' not in s:
              s=s.replace('</style>',css+'</style>',1)
          if 'id="marketReportToolbar"' not in s:
              target='<div id="marketOutput" style="margin-top:14px"></div>'
              repl='<div class="report-toolbar hidden" id="marketReportToolbar"><button class="btn" id="marketExportPdfBtn">Esporta PDF</button></div><div id="marketOutput" style="margin-top:14px"></div>'
              if target not in s: raise SystemExit('dashboard toolbar anchor missing')
              s=s.replace(target,repl,1)
          if 'MARKET_INTELLIGENCE_EXPORT_AND_CHARTS_2026' not in s:
              anchor='async function changeWorkspaceMIPlan(plan)'
              if anchor not in s: raise SystemExit('dashboard helper anchor missing')
              s=s.replace(anchor,dashboard_helper+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          # Main landing wording
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<b>Market Intelligence Pro</b><br> Disponibile anche separatamente, senza piano FlowPilot. Nel workspace sblocca analisi approfondite, ricerca web, competitor, trend, CAGR, forecast e fonti per il team.'
          new='<b>Market Intelligence Pro & Business</b><br> Pro include 10 generazioni mensili ed esportazione PDF. Business aggiunge generazioni illimitate e grafici nei report. Entrambi includono ricerca web, competitor, trend, CAGR, forecast e fonti.'
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile, sys
          for name in ['market-intelligence.html','dashboard.html','index.html']:
              s=pathlib.Path(name).read_text(encoding='utf-8')
              scripts=[]
              for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I):
                  scripts.append(m.group(1))
              js='\n'.join(scripts)
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8')
              f.write(js);f.close()
              r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
              if r.returncode:
                  print(name,r.stderr)
                  sys.exit(r.returncode)
              print(name,'OK')
          PY

      - name: Commit changes
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-intelligence.html dashboard.html index.html
          git commit -m "Add PDF export and Business charts to Market Intelligence" || exit 0
          git push
