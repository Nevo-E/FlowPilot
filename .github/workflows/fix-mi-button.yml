name: Fix Market Intelligence button alignment

on:
  push:
    paths:
      - '.github/workflows/fix-mi-button.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center Market Intelligence nav button text
        shell: python
        run: |
          from pathlib import Path
          p = Path('market-intelligence.html')
          s = p.read_text(encoding='utf-8')
          old = '.btn{border:1px solid transparent;border-radius:12px;min-height:40px;padding:0 16px;font-size:10px;font-weight:780;letter-spacing:-.01em;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease}'
          new = '.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;border:1px solid transparent;border-radius:12px;min-height:40px;padding:0 16px;font-size:10px;font-weight:780;letter-spacing:-.01em;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease}'
          if old not in s:
              raise SystemExit('Target .btn rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-intelligence.html
          git commit -m "Center Market Intelligence navigation button text"
          git push
