name: Patch Google Drive Integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-google-drive.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Drive integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('dashboard.html')
          s=p.read_text()
          pat=r'function renderIntegrations\(\)\{.*?\}\nasync function connectGoogleCalendar'
          repl='''function googleHasScope(scope){const row=state.integrations.find(x=>x.provider==="google");if(!row||row.status!=="connected")return false;const scopes=Array.isArray(row.scopes)?row.scopes:[];return scopes.some(x=>String(x||"").split(/\\s+/).includes(scope))}
function renderIntegrations(){const googleRow=state.integrations.find(x=>x.provider==="google"),canManage=!!state.team?.can_manage,calendarConnected=!!googleRow&&googleRow.status==="connected"&&(googleRow?.metadata?.calendar_access==="readonly"||googleHasScope("https://www.googleapis.com/auth/calendar.readonly")),driveConnected=!!googleRow&&googleRow.status==="connected"&&(googleRow?.metadata?.drive_access==="selected_files"||googleHasScope("https://www.googleapis.com/auth/drive.file"));$("integrationGrid").innerHTML=integrations.map(([p,i,n])=>{const row=state.integrations.find(x=>x.provider===p),c=row?.status==="connected";if(p==="google"){const actions=calendarConnected?`<div class="row-actions"><button class="btn small primary" onclick="syncGoogleCalendar()">Sincronizza</button>${canManage?`<button class="btn small danger" onclick="disconnectGoogleCalendar()">Disconnetti Google</button>`:""}</div>`:(canManage?`<button class="btn small primary" onclick="connectGoogleCalendar()">Connetti</button>`:`<button class="btn small" disabled>Solo owner/admin</button>`);return `<div class="card integration-card"><div style="font-size:20px;color:var(--p);font-weight:800">${i}</div><h3>${n}</h3><p>${calendarConnected?`Connesso${googleRow?.display_name?" · "+esc(googleRow.display_name):""}`:"Non connesso"}</p>${actions}</div>`}if(p==="slack"){const actions=c?`<div class="row-actions"><button class="btn small primary" onclick="syncSlack()">Sincronizza</button>${canManage?`<button class="btn small danger" onclick="disconnectSlack()">Disconnetti</button>`:""}</div>`:(canManage?`<button class="btn small primary" onclick="connectSlack()">Connetti</button>`:`<button class="btn small" disabled>Solo owner/admin</button>`);return `<div class="card integration-card"><div style="font-size:20px;color:var(--p);font-weight:800">${i}</div><h3>${n}</h3><p>${c?`Connesso${row?.display_name?" · "+esc(row.display_name):""}`:"Non connesso"}</p>${actions}</div>`}if(p==="drive"){const selected=Number(googleRow?.metadata?.drive_selected_count||0);const actions=driveConnected?`<div class="row-actions">${canManage?`<button class="btn small primary" onclick="chooseGoogleDriveFiles()">Scegli file</button>`:""}<button class="btn small" onclick="syncGoogleDrive()">Sincronizza</button></div>`:(canManage?`<button class="btn small primary" onclick="connectGoogleDrive()">Connetti</button>`:`<button class="btn small" disabled>Solo owner/admin</button>`);return `<div class="card integration-card"><div style="font-size:20px;color:var(--p);font-weight:800">${i}</div><h3>${n}</h3><p>${driveConnected?`Connesso${googleRow?.display_name?" · "+esc(googleRow.display_name):""}${selected?` · ${selected} file`:""}`:"Non connesso"}</p>${actions}</div>`}return `<div class="card integration-card"><div style="font-size:20px;color:var(--p);font-weight:800">${i}</div><h3>${n}</h3><p>${c?"Connesso":"Da configurare"}</p><button class="btn small" onclick="toast('${c?n+" è già connesso":"Configurazione OAuth necessaria"}')">${c?"Connesso":"Configura"}</button></div>`}).join("")}
async function connectGoogleCalendar'''
          ns,n=re.subn(pat,repl,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'renderIntegrations patch count={n}')
          ns=ns.replace('async function disconnectGoogleCalendar(){if(!confirm("Disconnettere Google Calendar?"))return;','async function disconnectGoogleCalendar(){if(!confirm("Disconnettere Google? Verranno scollegati sia Google Calendar sia Google Drive."))return;',1)
          anchor='window.disconnectSlack=disconnectSlack;\nfunction renderAll()'
          extra='''window.disconnectSlack=disconnectSlack;
async function connectGoogleDrive(){if(!state.workspace)return toast("Workspace non disponibile.");const returnUrl=new URL(location.href);returnUrl.searchParams.delete("integration");returnUrl.searchParams.delete("status");returnUrl.searchParams.delete("error");const {data,error}=await db.functions.invoke("integrations-manage",{body:{action:"start",workspace_id:state.workspace.id,provider:"google",capability:"drive",return_to:returnUrl.toString()}});if(error||data?.error){const code=data?.error||"oauth_start_failed";if(code==="google_not_configured")return toast("Credenziali Google non configurate lato server.");if(code==="integration_admin_required")return toast("Solo owner o admin può collegare Google Drive.");if(code==="paid_plan_required")return toast("Serve un piano FlowPilot attivo.");return toast("Impossibile avviare Google Drive.")}if(!data?.auth_url)return toast("URL Google non disponibile.");location.href=data.auth_url}window.connectGoogleDrive=connectGoogleDrive;
let pickerLoadPromise=null;function loadGooglePicker(){if(window.google?.picker)return Promise.resolve();if(pickerLoadPromise)return pickerLoadPromise;pickerLoadPromise=new Promise((resolve,reject)=>{const ready=()=>{try{gapi.load("picker",{callback:resolve,onerror:()=>reject(new Error("picker_load_failed")),timeout:10000,ontimeout:()=>reject(new Error("picker_load_timeout"))})}catch(e){reject(e)}};if(window.gapi)return ready();const sc=document.createElement("script");sc.src="https://apis.google.com/js/api.js";sc.async=true;sc.defer=true;sc.onload=ready;sc.onerror=()=>reject(new Error("google_api_script_failed"));document.head.appendChild(sc)});return pickerLoadPromise}
async function chooseGoogleDriveFiles(){const {data,error}=await db.functions.invoke("sync-google-drive",{body:{action:"picker_token",workspace_id:state.workspace.id}});if(error||data?.error){if(data?.error==="drive_scope_required")return connectGoogleDrive();if(data?.error==="google_picker_not_configured")return toast("Google Picker non configurato lato server.");return toast("Impossibile aprire Google Drive.")}try{await loadGooglePicker()}catch(_){return toast("Google Picker non disponibile.")}const view=new google.picker.DocsView(google.picker.ViewId.DOCS).setIncludeFolders(true).setSelectFolderEnabled(false);const picker=new google.picker.PickerBuilder().addView(view).enableFeature(google.picker.Feature.MULTISELECT_ENABLED).setOAuthToken(data.access_token).setDeveloperKey(data.developer_key).setAppId(String(data.app_id)).setOrigin(location.origin).setCallback(async result=>{if(result.action!==google.picker.Action.PICKED)return;const docs=(result.docs||[]).map(d=>({id:d.id||d[google.picker.Document.ID],name:d.name||d[google.picker.Document.NAME],mimeType:d.mimeType||d[google.picker.Document.MIME_TYPE]})).filter(x=>x.id);if(!docs.length)return;const {data:save,error:saveErr}=await db.functions.invoke("sync-google-drive",{body:{action:"select",workspace_id:state.workspace.id,files:docs}});if(saveErr||save?.error)return toast("Non è stato possibile salvare i file scelti.");toast(`${save?.accepted?.length||0} file collegati a FlowPilot.`);await syncGoogleDrive()}).build();picker.setVisible(true)}window.chooseGoogleDriveFiles=chooseGoogleDriveFiles;
async function syncGoogleDrive(){const {data,error}=await db.functions.invoke("sync-google-drive",{body:{action:"sync",workspace_id:state.workspace.id}});if(error||data?.error){if(data?.error==="drive_scope_required")return toast("Autorizza prima Google Drive.");if(data?.error==="reauthorization_required")return toast("Ricollega il tuo account Google.");return toast("Sincronizzazione Drive non riuscita.")}if(data?.message==="no_selected_files")toast("Drive connesso: scegli almeno un file.");else toast(`${data?.files_synced||0} file Drive sincronizzati.`);await loadData()}window.syncGoogleDrive=syncGoogleDrive;
function renderAll()'''
          if anchor not in ns:
              raise SystemExit('Drive insertion anchor not found')
          ns=ns.replace(anchor,extra,1)
          p.write_text(ns)
          PY
      - name: Check dashboard JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('dashboard.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('No inline script found')
          Path('/tmp/dashboard.js').write_text(blocks[-1])
          PY
          node --check /tmp/dashboard.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-google-drive.yml
          git add dashboard.html
          git commit -m 'Connect Google Drive Picker and sync'
          git push origin main
