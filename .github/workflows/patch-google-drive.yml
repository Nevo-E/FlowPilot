name: Patch Google Drive Integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-google-drive.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Drive integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_google_drive.py')
          s=p.read_text().replace('re.subn(pat, repl, s, flags=re.S)', 're.subn(pat, lambda m: repl, s, flags=re.S)')
          p.write_text(s)
          PY
          python3 .github/scripts/patch_google_drive.py
      - name: Check dashboard JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('dashboard.html').read_text()
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/dashboard.js').write_text(blocks[-1])
          PY
          node --check /tmp/dashboard.js
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-google-drive.yml .github/scripts/patch_google_drive.py
          git add dashboard.html
          git commit -m 'Connect Google Drive Picker and sync'
          git push origin main
