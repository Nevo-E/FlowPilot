name: Use Gemini for Luna

on:
  push:
    paths:
      - '.github/workflows/use-gemini-for-luna.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update dashboard AI provider label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="card-title">✦ Luna <span class="card-sub" id="lunaModelText">AI Operations Manager</span></div>','<div class="card-title">✦ Luna <span class="card-sub" id="lunaModelText">AI Operations Manager · Gemini</span></div>',1)
          old='$("lunaModelText").textContent=data.ai_enabled?" · GPT-5.6 Luna":" · modalità regole";'
          new='$("lunaModelText").textContent=data.ai_enabled?` · ${data.model||"Gemini"}`:" · Gemini non collegato";'
          if old not in s:
              raise SystemExit('Luna model label target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check inline JavaScript
        run: |
          python - <<'PY'
          import re,pathlib,subprocess,tempfile,sys
          s=pathlib.Path('dashboard.html').read_text(encoding='utf-8')
          js='\n'.join(m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I))
          f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8');f.write(js);f.close()
          r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr);sys.exit(r.returncode)
          PY
      - name: Commit changes
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Show Gemini as Luna AI engine" || exit 0
          git push
