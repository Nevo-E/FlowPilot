name: Tighten action cards

on:
  push:
    paths:
      - '.github/workflows/tighten-action-cards.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce empty space in action cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.action-card{display:flex;flex-direction:column;min-height:245px;padding:27px 25px 30px}.action-card .topline{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#80613A}.action-card h3,.cap h3{font-size:15px;letter-spacing:-.025em;margin:11px 0 8px}.action-card p,.cap p{font-size:10px;line-height:1.7;color:#707B84;margin:0}.action-result{margin-top:auto;padding:12px 14px;min-height:42px;display:flex;align-items:center;border-radius:13px;background:linear-gradient(145deg,#F2E8D7,#E9D8BA);border:1px solid #D7BE95;color:#0F1722;font-size:8px;font-weight:700}'
          new = '.action-card{display:flex;flex-direction:column;min-height:195px;padding:25px 25px 24px}.action-card .topline{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#80613A}.action-card h3,.cap h3{font-size:15px;letter-spacing:-.025em;margin:11px 0 8px}.action-card p,.cap p{font-size:10px;line-height:1.7;color:#707B84;margin:0}.action-result{margin-top:auto;padding:11px 14px;min-height:40px;display:flex;align-items:center;border-radius:13px;background:linear-gradient(145deg,#F2E8D7,#E9D8BA);border:1px solid #D7BE95;color:#0F1722;font-size:8px;font-weight:700}'
          if old not in s:
              raise SystemExit('Target action-card CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit tighter card spacing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tighten landing action card spacing"
          git push
