name: Remove Luna rules pill

on:
  push:
    paths:
      - '.github/workflows/remove-luna-rules-pill.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Luna status pill from dashboard topbar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span class="pill luna-pill" id="lunaStatus">Luna</span>','')
          s=s.replace('$("lunaStatus").textContent=data.ai_enabled?"Luna AI attiva":"Luna rules";','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Remove Luna rules from dashboard topbar" || exit 0
          git push
