name: Trigger Market Intelligence PDF charts patch

on:
  push:
    paths:
      - '.github/workflows/trigger-market-intelligence-pdf-charts.yml'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Trigger patch workflow
        run: |
          echo "# triggered $(date -u +%s)" >> .github/workflows/apply-market-intelligence-pdf-charts.yml
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/apply-market-intelligence-pdf-charts.yml
          git commit -m "Trigger Market Intelligence PDF charts patch"
          git push

# run 2
