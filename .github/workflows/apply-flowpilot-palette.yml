name: Apply FlowPilot brand palette

on:
  push:
    paths:
      - '.github/workflows/apply-flowpilot-palette.yml'

permissions:
  contents: write

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply palette across all product pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('index.html'),
              Path('dashboard.html'),
              Path('market-intelligence.html'),
              Path('invite.html'),
              Path('reset-password.html'),
          ]

          palette = {
              # backgrounds / surfaces
              '#f7f8fc':'#FBF2E1','#f6f7fb':'#FBF2E1','#f8f8fb':'#FFF9EF','#fbfbfd':'#FFF9EF','#fafafd':'#FFF9EF',
              '#f2f3f8':'#F1E0C3','#f2f3f7':'#F3E4CC','#f3f4f7':'#F3E4CC','#f2f3f6':'#F3E4CC','#f1f2f6':'#F4E8D3',
              '#f7f6ff':'#F4E5CC','#f0efff':'#EEDDBF','#efefff':'#EEDDBF','#efeeff':'#EAD7B7','#ecebff':'#EAD7B7',
              '#f4f3ff':'#F4E5CC','#e5e2ff':'#D2B68A','#e7e6ff':'#E1CBA7','#e6e3ff':'#D2B68A',
              '#e8eaf0':'#DEC69D','#e7e9ef':'#D2B68A','#d9dce7':'#D2B68A','#c9cedd':'#B89562','#d8dbe6':'#D2B68A',
              '#dcddea':'#D2B68A','#dfe1e9':'#D2B68A','#d7d9e2':'#C7AA7D','#eceef3':'#E8D5B6','#eeeef3':'#E8D5B6',
              '#eff0f4':'#E7D4B4','#f0f1f5':'#E7D4B4',
              '#ffffff':'#FFF9EF','#fff':'#FFF9EF',

              # dark / text
              '#12131c':'#0B4745','#151722':'#0B4745','#171925':'#073B39','#11121b':'#073B39','#1a1b29':'#0B4745',
              '#101119':'#073B39','#1c1e2f':'#0B4745','#15161f':'#073B39','#151620':'#073B39','#0f1018':'#063432',
              '#26264c':'#0E5350','#272754':'#0E5350','#29285a':'#0E5350','#252735':'#124E4C','#25263a':'#124E4C',
              '#22232f':'#104542','#33354b':'#1C5A57','#34364a':'#1C5A57','#3a3d50':'#2A6663','#44485f':'#2A6663','#4b4f68':'#39706D',
              '#333644':'#174F4C','#383b49':'#174F4C','#444857':'#285E5B','#565a69':'#526E68','#525666':'#496A64',
              '#5d6171':'#58736D','#5f6372':'#58736D','#64697b':'#5A746E','#6f7385':'#687D77','#717688':'#687D77','#72778a':'#687D77','#73788b':'#687D77','#74788a':'#687D77',
              '#777b8c':'#6C817A','#7d8190':'#73877F','#808495':'#71847D','#818596':'#71847D','#828696':'#71847D','#838798':'#71847D',
              '#85899a':'#73877F','#85899c':'#73877F','#878b99':'#73877F','#8a8e9d':'#73877F','#8b8f9e':'#73877F','#8d91a0':'#73877F',
              '#8f93a2':'#73877F','#9295a4':'#788A84','#9296a5':'#788A84','#9296a4':'#788A84','#9397a6':'#788A84','#9699a7':'#7D8D87','#9699a8':'#7D8D87',
              '#979aab':'#7D8D87','#9a9dab':'#7D8D87','#9a9dac':'#D2B68A','#9da0af':'#C7B28D','#a6a9b8':'#D7C6A8','#aaaebb':'#D9C8AA','#aeb1be':'#DCCBAE','#b3b5c4':'#E3D3B8','#b5b7c4':'#E3D3B8','#b8bac7':'#E7D8BF','#c0c1cb':'#E7D8BF','#d4d5dc':'#F0E2CA','#d6d7df':'#F0E2CA',

              # primary purples -> deep green / tan accents
              '#625bf6':'#0B4745','#5b55f7':'#0B4745','#756fff':'#1B5B58','#8a84ff':'#2A6A66','#4b43e7':'#0B4745','#4942e6':'#0B4745','#554ee9':'#073B39',
              '#796fff':'#D2B68A','#9f9bff':'#D2B68A','#9994ff':'#D2B68A','#aaa6ff':'#D2B68A','#ecebff':'#EAD7B7',
              '#514bdd':'#0B4745','#514bd4':'#0B4745','#5b55e8':'#0B4745','#4e49ce':'#0B4745','#5c56dd':'#0B4745','#5d57d9':'#0B4745','#665ff0':'#0B4745','#615add':'#0B4745','#716bd8':'#285E5B',

              # semantic colors translated into palette family
              '#15936c':'#0B4745','#17956d':'#0B4745','#16906c':'#0B4745','#14805e':'#0B4745','#147b5d':'#0B4745','#137e5d':'#0B4745','#148263':'#0B4745','#147a5b':'#0B4745',
              '#e9f8f2':'#EFE2CB','#ceeee1':'#D2B68A','#eaf8f2':'#EFE2CB','#ecf9f4':'#EFE2CB','#ebf9f3':'#EFE2CB','#cdeee0':'#D2B68A',
              '#c77724':'#9A7442','#e49523':'#9A7442','#b87722':'#9A7442','#a56722':'#9A7442','#b97412':'#9A7442','#a56b14':'#9A7442','#91621d':'#8B683D','#94661e':'#8B683D','#90611d':'#8B683D',
              '#fff5e8':'#F3E4CC','#fff7e8':'#F3E4CC','#fff8e9':'#F3E4CC','#f2e3be':'#D2B68A',
              '#c64b5c':'#76533E','#d64d62':'#76533E','#b44353':'#76533E','#c74055':'#76533E','#b13d50':'#76533E','#a83749':'#76533E','#ad3c4d':'#76533E','#ae3f51':'#76533E',
              '#fff0f2':'#F0DFC4','#fff1f3':'#F0DFC4','#fff5f6':'#F0DFC4','#f2ced4':'#D2B68A','#f0cbd1':'#D2B68A',
          }

          rgba = {
              'rgba(98,91,246,':'rgba(11,71,69,',
              'rgba(117,111,255,':'rgba(210,182,138,',
              'rgba(121,111,255,':'rgba(210,182,138,',
              'rgba(170,166,255,':'rgba(210,182,138,',
              'rgba(28,31,55,':'rgba(11,71,69,',
              'rgba(20,21,34,':'rgba(7,59,57,',
              'rgba(25,27,45,':'rgba(11,71,69,',
              'rgba(15,16,25,':'rgba(7,59,57,',
              'rgba(12,13,21,':'rgba(7,59,57,',
              'rgba(246,247,251,':'rgba(251,242,225,',
              'rgba(247,248,252,':'rgba(251,242,225,',
              'rgba(255,255,255,':'rgba(251,242,225,',
          }

          root_overrides = {
              'index.html': ':root{--bg:#FBF2E1;--surface:#FFF9EF;--surface-2:#F1E0C3;--text:#0B4745;--muted:#687D77;--line:#D2B68A;--line-strong:#B89562;--purple:#0B4745;--purple-2:#2A6A66;--purple-soft:#EAD7B7;--dark:#073B39;--dark-2:#0B4745;--green:#0B4745;--orange:#9A7442;--red:#76533E} body{background:#FBF2E1;color:#0B4745}.btn-primary{background:#0B4745;color:#FBF2E1}.btn-primary:hover{background:#073B39}.btn-secondary,.mobile-menu{background:#FFF9EF;color:#0B4745}.section.white{background:#FFF9EF}.section.dark{background:linear-gradient(150deg,#073B39,#0B4745);color:#FBF2E1}.final-box{background:linear-gradient(145deg,#073B39,#0B4745)}',
              'dashboard.html': ':root{--bg:#FBF2E1;--card:#FFF9EF;--text:#0B4745;--muted:#687D77;--line:#D2B68A;--p:#0B4745;--p2:#2A6A66;--dark:#073B39;--green:#0B4745;--red:#76533E;--orange:#9A7442} body{background:#FBF2E1;color:#0B4745}.sidebar{background:#073B39}.topbar{background:rgba(251,242,225,.94)}.card{background:#FFF9EF;border-color:#D2B68A}.btn.primary{background:#0B4745;border-color:#0B4745;color:#FBF2E1}.plan-pill,.luna-pill{background:#EAD7B7;color:#0B4745}.market-pill{background:#F0DFC4;color:#0B4745}.loader{background:#FBF2E1}',
              'market-intelligence.html': ':root{--bg:#FBF2E1;--card:#FFF9EF;--text:#0B4745;--muted:#687D77;--line:#D2B68A;--p:#0B4745;--p2:#2A6A66;--soft:#EAD7B7;--dark:#073B39;--green:#0B4745;--orange:#9A7442;--red:#76533E} body{background:#FBF2E1;color:#0B4745}.nav{background:rgba(251,242,225,.94)}.panel,.searchbox,.metric,.block,.history-item{background:#FFF9EF;border-color:#D2B68A}.primary{background:#0B4745;color:#FBF2E1}.secondary{background:#FFF9EF;color:#0B4745;border-color:#D2B68A}',
              'invite.html': ':root{--bg:#FBF2E1;--card:#FFF9EF;--text:#0B4745;--muted:#687D77;--line:#D2B68A;--primary:#0B4745;--primary2:#2A6A66} body{background:radial-gradient(circle at 50% 10%,rgba(210,182,138,.28),transparent 34%),#FBF2E1;color:#0B4745}.card{background:#FFF9EF;border-color:#D2B68A}.hero{background:linear-gradient(145deg,#073B39,#0B4745);color:#FBF2E1}.primary{background:#0B4745;color:#FBF2E1}.secondary{background:#FFF9EF;color:#0B4745;border-color:#D2B68A}',
              'reset-password.html': ':root{--bg:#FBF2E1;--text:#0B4745;--muted:#687D77;--line:#D2B68A;--primary:#0B4745;--primary2:#2A6A66} body{background:radial-gradient(circle at 50% 10%,rgba(210,182,138,.28),transparent 34%),#FBF2E1;color:#0B4745}.card{background:#FFF9EF;border-color:#D2B68A}.hero{background:linear-gradient(145deg,#073B39,#0B4745);color:#FBF2E1}.primary{background:#0B4745;color:#FBF2E1}.secondary{background:#FFF9EF;color:#0B4745;border-color:#D2B68A}',
          }

          hex_re = re.compile(r'#[0-9a-fA-F]{3,6}\b')

          for p in files:
              s = p.read_text(encoding='utf-8')
              def repl(m):
                  c = m.group(0)
                  return palette.get(c.lower(), c)
              s = hex_re.sub(repl, s)
              for old,new in rgba.items():
                  s = s.replace(old,new)
              # common CSS keyword surfaces
              s = s.replace('background:white','background:#FFF9EF')
              s = s.replace('color:white','color:#FBF2E1')
              s = s.replace('border:2px solid white','border:2px solid #FBF2E1')
              marker = '/* FLOWPILOT_PALETTE_2026 */'
              if marker not in s and '</style>' in s:
                  s = s.replace('</style>', f'{marker}{root_overrides[p.name]}</style>', 1)
              p.write_text(s, encoding='utf-8')

          # Keep the legacy redirect visually consistent in the unlikely event JS redirect is delayed.
          legacy = Path('marketlens.html')
          if legacy.exists():
              s = legacy.read_text(encoding='utf-8')
              if '<style>' not in s:
                  s = s.replace('</head>','<style>body{margin:0;background:#FBF2E1;color:#0B4745;font-family:Inter,system-ui,sans-serif}a{color:#0B4745}</style></head>')
              legacy.write_text(s,encoding='utf-8')
          PY
      - name: Commit palette refresh
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html dashboard.html market-intelligence.html invite.html reset-password.html marketlens.html
          git commit -m "Apply new FlowPilot green cream sand palette" || exit 0
          git push
