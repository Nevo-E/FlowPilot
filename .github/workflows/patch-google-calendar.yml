name: Patch Google Calendar frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-google-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard integration only
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard.html')
          text = p.read_text(encoding='utf-8')
          old = '''const integrations=[["gmail","G","Gmail"],["calendar","C","Google Calendar"],["slack","S","Slack"],["crm","CRM","CRM"],["drive","D","Google Drive"],["stripe","€","Stripe"]];function renderIntegrations(){$("integrationGrid").innerHTML=integrations.map(([p,i,n])=>{const c=state.integrations.find(x=>x.provider===p)?.status==="connected";return `<div class="card integration-card"><div style="font-size:20px;color:var(--p);font-weight:800">${i}</div><h3>${n}</h3><p>${c?"Connesso":"Da configurare"}</p><button class="btn small" onclick="toast('${c?n+" è già connesso":"Configurazione OAuth necessaria"}')">${c?"Connesso":"Configura"}</button></div>`}).join("")}'''
          new = '''const integrations=[["gmail","G","Gmail"],["google","C","Google Calendar"],["slack","S","Slack"],["crm","CRM","CRM"],["drive","D","Google Drive"],["stripe","€","Stripe"]];
          function renderIntegrations(){$("integrationGrid").innerHTML=integrations.map(([p,i,n])=>{const row=state.integrations.find(x=>x.provider===p),c=row?.status==="connected",canManage=!!state.team?.can_manage;if(p==="google"){const actions=c?`<div class="row-actions"><button class="btn small primary" onclick="syncGoogleCalendar()">Sincronizza</button>${canManage?`<button class="btn small danger" onclick="disconnectGoogleCalendar()">Disconnetti</button>`:""}</div>`:(canManage?`<button class="btn small primary" onclick="connectGoogleCalendar()">Connetti</button>`:`<button class="btn small" disabled>Solo owner/admin</button>`);return `<div class="card integration-card"><div style="font-size:20px;color:var(--p);font-weight:800">${i}</div><h3>${n}</h3><p>${c?`Connesso${row?.display_name?" · "+esc(row.display_name):""}`:"Non connesso"}</p>${actions}</div>`}return `<div class="card integration-card"><div style="font-size:20px;color:var(--p);font-weight:800">${i}</div><h3>${n}</h3><p>${c?"Connesso":"Da configurare"}</p><button class="btn small" onclick="toast('${c?n+" è già connesso":"Configurazione OAuth necessaria"}')">${c?"Connesso":"Configura"}</button></div>`}).join("")}
          async function connectGoogleCalendar(){if(!state.workspace)return toast("Workspace non disponibile.");const returnUrl=new URL(location.href);returnUrl.searchParams.delete("integration");returnUrl.searchParams.delete("status");returnUrl.searchParams.delete("error");const {data,error}=await db.functions.invoke("integrations-manage",{body:{action:"start",workspace_id:state.workspace.id,provider:"google",return_to:returnUrl.toString()}});if(error||data?.error){const code=data?.error||"oauth_start_failed";if(code==="google_not_configured")return toast("Credenziali Google non configurate lato server.");if(code==="integration_admin_required")return toast("Solo owner o admin può collegare Google Calendar.");if(code==="paid_plan_required")return toast("Serve un piano FlowPilot attivo.");return toast("Impossibile avviare Google Calendar.")}if(!data?.auth_url)return toast("URL Google non disponibile.");location.href=data.auth_url}
          window.connectGoogleCalendar=connectGoogleCalendar;
          async function syncGoogleCalendar(){const {data,error}=await db.functions.invoke("sync-google-calendar",{body:{workspace_id:state.workspace.id}});if(error||data?.error)return toast(data?.error==="reauthorization_required"?"Ricollega Google Calendar.":"Sincronizzazione non riuscita.");toast(`${data?.events_upserted||0} eventi sincronizzati.`);await loadData()}
          window.syncGoogleCalendar=syncGoogleCalendar;
          async function disconnectGoogleCalendar(){if(!confirm("Disconnettere Google Calendar?"))return;const {data,error}=await db.functions.invoke("integrations-manage",{body:{action:"disconnect",workspace_id:state.workspace.id,provider:"google"}});if(error||data?.error)return toast("Disconnessione non riuscita.");toast("Google Calendar disconnesso.");await loadData()}
          window.disconnectGoogleCalendar=disconnectGoogleCalendar;'''
          if old not in text:
              raise SystemExit('Expected legacy integration block not found; refusing to modify dashboard')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dashboard.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          inline = '\n'.join(b for b in blocks if b.strip())
          Path('/tmp/flowpilot-inline.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/flowpilot-inline.js

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          git rm .github/workflows/patch-google-calendar.yml
          git commit -m "Fix Google Calendar connect button without blocking dashboard"
          git push origin main
