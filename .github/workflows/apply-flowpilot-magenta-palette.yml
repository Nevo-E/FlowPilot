name: Apply FlowPilot magenta palette
on:
  push:
    paths:
      - '.github/workflows/apply-flowpilot-magenta-palette.yml'
permissions:
  contents: write
jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply palette
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['index.html','dashboard.html','market-intelligence.html','invite.html','reset-password.html']
          repl={
            '#FBF2E1':'#FFF7FA','#FFF9EF':'#FFFFFF','#F1E0C3':'#FCE7EF','#F3E4CC':'#F9DFE9','#F4E8D3':'#FBEAF0','#F4E5CC':'#F8DCE7','#EEDDBF':'#F7D1E0','#EAD7B7':'#F5CBD9','#E1CBA7':'#EFC1D2','#DEC69D':'#ECC1D0','#D2B68A':'#E5B6C9','#B89562':'#C97091','#C7AA7D':'#D893AC','#E8D5B6':'#F4CEDC','#E7D4B4':'#F3CAD9','#EFE2CB':'#F9DFE8','#F0DFC4':'#F8D6E2','#F0E2CA':'#F7D6E2','#E7D8BF':'#F5D4E0','#D9C8AA':'#F0C8D7','#DCCBAE':'#F2CADA','#E3D3B8':'#F3D0DC','#C7B28D':'#DCA1B6','#D7C6A8':'#EBC2D1',
            '#063432':'#510926','#073B39':'#510926','#0B4745':'#5B0A2B','#0E5350':'#6B0E34','#104542':'#6B0E34','#124E4C':'#840941','#1C5A57':'#840941','#2A6663':'#960C44','#39706D':'#9B0D47','#174F4C':'#6B0E34','#285E5B':'#840941','#526E68':'#7E5062','#496A64':'#765065','#58736D':'#7A5866','#5A746E':'#7B5B68','#687D77':'#806673','#6C817A':'#846A76','#71847D':'#876D79','#73877F':'#8B707C','#788A84':'#8E7580','#7D8D87':'#927983','#9A7442':'#B21253','#8B683D':'#9B0D47','#76533E':'#840941',
            '#625BF6':'#E00056','#5B55F7':'#E00056','#756FFF':'#C60C58','#8A84FF':'#B21253','#2A6A66':'#B21253'
          }
          for f in files:
            p=Path(f); s=p.read_text(encoding='utf-8')
            for a,b in repl.items(): s=re.sub(re.escape(a),b,s,flags=re.I)
            s=s.replace('rgba(11,71,69,','rgba(91,10,43,').replace('rgba(7,59,57,','rgba(81,9,38,').replace('rgba(210,182,138,','rgba(224,0,86,').replace('rgba(251,242,225,','rgba(255,247,250,')
            marker='/* FLOWPILOT_MAGENTA_PALETTE_2026 */'
            if marker not in s:
              if f=='index.html': extra=':root{--bg:#FFF7FA;--surface:#fff;--surface-2:#FCE7EF;--text:#510926;--muted:#806673;--line:#E5B6C9;--line-strong:#C97091;--purple:#E00056;--purple-2:#C60C58;--purple-soft:#F7D1E0;--dark:#510926;--dark-2:#6B0E34;--green:#960C44;--orange:#B21253;--red:#E00056}.nav{background:rgba(255,247,250,.92)}.logo,.mini-logo{background:linear-gradient(135deg,#E00056,#960C44)}.btn-primary{background:#E00056;color:#fff}.btn-primary:hover{background:#C60C58}.section.dark,.final-box,.flow-core,.luna-box,.integration-core{background:linear-gradient(145deg,#510926,#840941)}.gradient{background:linear-gradient(110deg,#E00056,#B21253);-webkit-background-clip:text;background-clip:text;color:transparent}.product-shell,.product-side{background:#510926}.price.featured{border-color:#E00056;box-shadow:0 0 0 3px #F7D1E0,var(--shadow)}'
              elif f=='dashboard.html': extra=':root{--bg:#FFF7FA;--card:#fff;--text:#510926;--muted:#806673;--line:#E5B6C9;--p:#E00056;--p2:#C60C58;--dark:#510926;--green:#960C44;--red:#E00056;--orange:#B21253}.sidebar{background:#510926}.mark{background:linear-gradient(135deg,#E00056,#960C44)}.nav-btn:hover,.nav-btn.active{background:#6B0E34}.topbar{background:rgba(255,247,250,.94)}.btn.primary{background:#E00056;border-color:#E00056;color:#fff}.briefing,.market-hero{background:linear-gradient(145deg,#510926,#840941)}.progress span,.seat-bar span{background:linear-gradient(90deg,#E00056,#B21253)}.msg.user{background:#E00056}.loader{background:#FFF7FA}.spinner{border-color:#F1CFDC;border-top-color:#E00056}'
              elif f=='market-intelligence.html': extra=':root{--bg:#FFF7FA;--card:#fff;--text:#510926;--muted:#806673;--line:#E5B6C9;--p:#E00056;--p2:#C60C58;--soft:#F7D1E0;--dark:#510926;--green:#960C44;--orange:#B21253;--red:#E00056}.nav{background:rgba(255,247,250,.94)}.mark{background:linear-gradient(135deg,#E00056,#960C44)}.primary{background:#E00056;color:#fff}.accountbar{background:linear-gradient(145deg,#510926,#840941)}.pill{background:#F7D1E0;color:#840941}'
              else: extra=':root{--bg:#FFF7FA;--text:#510926;--muted:#806673;--line:#E5B6C9;--primary:#E00056;--primary2:#C60C58}.mark{background:linear-gradient(135deg,#E00056,#960C44)}.hero{background:linear-gradient(145deg,#510926,#840941)}.primary{background:#E00056;color:#fff}.spinner{border-color:#F1CFDC;border-top-color:#E00056}.icon{background:#F7D1E0;color:#840941}'
              s=s.replace('</style>',marker+extra+'</style>',1)
            p.write_text(s,encoding='utf-8')
          p=Path('marketlens.html')
          if p.exists():
            s=p.read_text(encoding='utf-8'); s=s.replace('#FBF2E1','#FFF7FA').replace('#0B4745','#510926'); p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html dashboard.html market-intelligence.html invite.html reset-password.html marketlens.html
          git commit -m "Try FlowPilot magenta burgundy palette" || exit 0
          git push
