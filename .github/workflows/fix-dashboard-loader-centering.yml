name: Fix dashboard loader centering

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-loader-centering.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Center dashboard loading indicator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dashboard.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:200}.spinner{width:34px;height:34px;border:3px solid #e4e5ec;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}'
          new_css = '.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:200}.loader-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.spinner{width:34px;height:34px;border:3px solid #e4e5ec;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}'
          if old_css not in s:
              raise SystemExit('loader css target not found')
          s = s.replace(old_css, new_css, 1)

          old_html = '<div class="loader" id="loader"><div><div class="spinner"></div><div style="margin-top:10px;font-size:9px;color:#74788a">Caricamento workspace…</div></div></div>'
          new_html = '<div class="loader" id="loader"><div class="loader-inner"><div class="spinner"></div><div style="margin-top:10px;font-size:9px;color:#74788a">Caricamento workspace…</div></div></div>'
          if old_html not in s:
              raise SystemExit('loader html target not found')
          s = s.replace(old_html, new_html, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          git commit -m "Center dashboard workspace loader" || exit 0
          git push
