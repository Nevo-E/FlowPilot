name: Fix Market Intelligence plan switching

on:
  push:
    paths:
      - '.github/workflows/fix-market-intelligence-plan-switching.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire Pro Business plan changes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Standalone
          p=Path('market-intelligence.html')
          s=p.read_text(encoding='utf-8')
          old='''$("planPill").textContent=plan.toUpperCase();$("upgradeBtn").style.display=plan==="base"?"block":"none";$("businessBtn").style.display=plan==="business"?"none":"block";$("businessBtn").textContent=plan==="pro"&&personal?"Gestisci / passa a Business →":"Attiva Business →";$("billingBtn").classList.toggle("hidden",!(paid&&personal));'''
          new='''$("planPill").textContent=plan.toUpperCase();$("upgradeBtn").style.display=(plan==="base"||(plan==="business"&&personal))?"block":"none";$("upgradeBtn").textContent=plan==="business"&&personal?"Passa a Pro →":"Attiva Pro →";$("businessBtn").style.display=plan==="business"?"none":"block";$("businessBtn").textContent=plan==="pro"&&personal?"Passa a Business →":"Attiva Business →";$("billingBtn").classList.toggle("hidden",!(paid&&personal));'''
          if old not in s: raise SystemExit('standalone button state target not found')
          s=s.replace(old,new,1)

          old='''async function upgrade(plan="pro"){if(!user){authOpen("signup");return}if(entSource==="personal"&&active()&&ent?.plan!==plan){toast("Apriamo la gestione del piano per completare il cambio.");return billing()}const btn=plan==="business"?$("businessBtn"):$("upgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-checkout",{body:{plan}});btn.disabled=false;if(error||!data?.url){if(data?.error==="already_active")toast(`${plan==="business"?"Business":"Pro"} è già attivo.`);else if(data?.error==="manage_existing_subscription"){toast("Gestisci il piano dal portale pagamenti.");return billing()}else toast("Impossibile aprire il pagamento.");await loadAccount();return}location.href=data.url}
async function billing()'''
          new='''async function changePlan(plan){const label=plan==="business"?"Business (€24,99/mese)":"Pro (€14,99/mese)";if(!confirm(`Vuoi passare a Market Intelligence ${label}? Stripe calcolerà automaticamente l'eventuale conguaglio del periodo corrente.`))return;const btn=plan==="business"?$("businessBtn"):$("upgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-change-plan",{body:{plan}});btn.disabled=false;if(error||data?.error){if(data?.pending){toast("Cambio piano in attesa del pagamento. Controlla il metodo di pagamento.");return billing()}return toast("Non è stato possibile cambiare piano.")}toast(`Market Intelligence ${plan==="business"?"Business":"Pro"} è attivo.`);await loadAccount()}
async function upgrade(plan="pro"){if(!user){authOpen("signup");return}if(entSource==="personal"&&active()&&ent?.plan!==plan)return changePlan(plan);const btn=plan==="business"?$("businessBtn"):$("upgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-checkout",{body:{plan}});btn.disabled=false;if(error||!data?.url){if(data?.error==="already_active")toast(`${plan==="business"?"Business":"Pro"} è già attivo.`);else if(data?.error==="manage_existing_subscription")return changePlan(plan);else toast("Impossibile aprire il pagamento.");await loadAccount();return}location.href=data.url}
async function billing()'''
          if old not in s: raise SystemExit('standalone upgrade target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Dashboard
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          old='''$("marketUpgradeBtn").disabled=!isOwner;$("marketBusinessBtn").disabled=!isOwner;$("marketUpgradeBtn").style.display=plan==="base"?"inline-block":"none";$("marketBusinessBtn").style.display=plan==="business"?"none":"inline-block";if(plan==="business")'''
          new='''$("marketUpgradeBtn").disabled=!isOwner;$("marketBusinessBtn").disabled=!isOwner;const workspaceTier=state.marketIntelligenceSource==="workspace";$("marketUpgradeBtn").style.display=(plan==="base"||(plan==="business"&&workspaceTier))?"inline-block":"none";$("marketBusinessBtn").style.display=plan==="business"?"none":"inline-block";$("marketUpgradeBtn").textContent=plan==="business"&&workspaceTier?"Passa a Pro · €14,99/mese":(isOwner?"Pro · €14,99/mese":"Attivabile dal proprietario");if(plan==="business")'''
          if old not in s: raise SystemExit('dashboard button state target not found')
          s=s.replace(old,new,1)

          old='''async function startMI(plan="pro"){if(state.workspace.owner_id!==state.user.id)return toast("Solo il proprietario può attivare un piano Market Intelligence.");if(state.marketIntelligenceSource==="workspace"&&marketPaid()){toast("Apriamo la gestione del piano per completare il cambio.");return portal()}const btn=plan==="business"?$("marketBusinessBtn"):$("marketUpgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-checkout",{body:{workspace_id:state.workspace.id,plan}});btn.disabled=false;if(error||!data?.url){if(data?.error==="manage_existing_subscription"){toast("Gestisci il cambio piano dal portale pagamenti.");return portal()}return toast("Impossibile aprire il pagamento.")}location.href=data.url}$("marketUpgradeBtn").onclick=()=>startMI("pro");$("marketBusinessBtn").onclick=()=>startMI("business");'''
          new='''async function changeWorkspaceMIPlan(plan){const label=plan==="business"?"Business (€24,99/mese)":"Pro (€14,99/mese)";if(!confirm(`Vuoi passare il workspace a Market Intelligence ${label}? Stripe calcolerà automaticamente l'eventuale conguaglio del periodo corrente.`))return;const btn=plan==="business"?$("marketBusinessBtn"):$("marketUpgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-change-plan",{body:{workspace_id:state.workspace.id,plan}});btn.disabled=false;if(error||data?.error){if(data?.pending){toast("Cambio piano in attesa del pagamento. Controlla il metodo di pagamento.");return portal()}return toast("Non è stato possibile cambiare piano.")}toast(`Market Intelligence ${plan==="business"?"Business":"Pro"} è attivo per il team.`);await loadMarketIntelligence()}
async function startMI(plan="pro"){if(state.workspace.owner_id!==state.user.id)return toast("Solo il proprietario può attivare un piano Market Intelligence.");if(state.marketIntelligenceSource==="workspace"&&marketPaid()&&state.marketIntelligence?.plan!==plan)return changeWorkspaceMIPlan(plan);if(state.marketIntelligenceSource==="workspace"&&state.marketIntelligence?.plan===plan)return toast(`Market Intelligence ${plan==="business"?"Business":"Pro"} è già attivo.`);const btn=plan==="business"?$("marketBusinessBtn"):$("marketUpgradeBtn");btn.disabled=true;const {data,error}=await db.functions.invoke("market-intelligence-checkout",{body:{workspace_id:state.workspace.id,plan}});btn.disabled=false;if(error||!data?.url){if(data?.error==="manage_existing_subscription")return changeWorkspaceMIPlan(plan);return toast("Impossibile aprire il pagamento.")}location.href=data.url}$("marketUpgradeBtn").onclick=()=>startMI("pro");$("marketBusinessBtn").onclick=()=>startMI("business");'''
          if old not in s: raise SystemExit('dashboard startMI target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "FlowPilot Bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-intelligence.html dashboard.html
          git commit -m "Enable Market Intelligence plan switching" || exit 0
          git push
